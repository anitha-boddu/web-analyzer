<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Web Analyzer - Login</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
      transition: all 0.5s ease;
    }

    body.dark-theme::before {
      background: 
        radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.3) 0%, transparent 50%),
        radial-gradient(circle at 40% 40%, rgba(120, 219, 255, 0.2) 0%, transparent 50%),
        linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
    }

    body.light-theme::before {
      background: 
        radial-gradient(circle at 20% 80%, rgba(59, 130, 246, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(168, 85, 247, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 40% 40%, rgba(34, 197, 94, 0.1) 0%, transparent 50%),
        linear-gradient(135deg, #f8fafc 0%, #f1f5f9 50%, #e2e8f0 100%);
    }

    body.dark-theme {
      color: #f1f5f9;
    }

    body.light-theme {
      color: #1e293b;
    }

    /* Animated background particles */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      animation: float 6s ease-in-out infinite;
    }

    .dark-theme .particle {
      background: rgba(148, 163, 184, 0.3);
    }

    .light-theme .particle {
      background: rgba(59, 130, 246, 0.2);
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.7; }
      50% { transform: translateY(-20px) rotate(180deg); opacity: 1; }
    }

    .main-content {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 2rem;
      position: relative;
    }

    .login-container {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(32px);
      -webkit-backdrop-filter: blur(32px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 3.5rem;
      border-radius: 24px;
      width: 100%;
      max-width: 440px;
      box-shadow: 
        0 32px 64px -12px rgba(0, 0, 0, 0.25),
        0 0 0 1px rgba(255, 255, 255, 0.05) inset,
        0 1px 0 rgba(255, 255, 255, 0.1) inset;
      animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }

    .light-theme .login-container {
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 
        0 32px 64px -12px rgba(0, 0, 0, 0.08),
        0 0 0 1px rgba(0, 0, 0, 0.05) inset;
    }

    .login-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
      animation: shimmer 3s infinite;
    }

    @keyframes shimmer {
      0% { left: -100%; }
      100% { left: 100%; }
    }

    .brand-section {
      text-align: center;
      margin-bottom: 2.5rem;
      position: relative;
    }

    .brand-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 1rem;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      animation: pulse 2s infinite;
      box-shadow: 0 8px 32px rgba(59, 130, 246, 0.3);
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.02em;
    }

    .subtitle {
      font-size: 0.95rem;
      opacity: 0.7;
      font-weight: 500;
      margin-bottom: 0.5rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
      position: relative;
    }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.1rem;
      opacity: 0.5;
      transition: all 0.3s ease;
      z-index: 2;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 1rem 1rem 1rem 3rem;
      border: 2px solid rgba(148, 163, 184, 0.2);
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 500;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(8px);
      position: relative;
    }

    .light-theme input[type="text"],
    .light-theme input[type="password"] {
      background: rgba(255, 255, 255, 0.7);
      border-color: rgba(148, 163, 184, 0.3);
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 
        0 0 0 4px rgba(59, 130, 246, 0.1),
        0 8px 25px -5px rgba(59, 130, 246, 0.2);
      transform: translateY(-1px);
    }

    input[type="text"]:focus + .input-icon,
    input[type="password"]:focus + .input-icon {
      color: #3b82f6;
      opacity: 1;
    }

    .login-button {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      margin-top: 1rem;
      position: relative;
      overflow: hidden;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .login-button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.5s;
    }

    .login-button:hover::before {
      left: 100%;
    }

    .login-button:hover {
      transform: translateY(-2px);
      box-shadow: 
        0 12px 35px -5px rgba(59, 130, 246, 0.4),
        0 0 0 1px rgba(255, 255, 255, 0.1) inset;
    }

    .login-button:active {
      transform: translateY(0);
    }

    .register-link {
      margin-top: 2.5rem;
      text-align: center;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .register-link a {
      color: #3b82f6;
      text-decoration: none;
      font-weight: 700;
      position: relative;
      transition: all 0.3s ease;
    }

    .register-link a::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 0;
      height: 2px;
      background: linear-gradient(90deg, #3b82f6, #8b5cf6);
      transition: width 0.3s ease;
    }

    .register-link a:hover::after {
      width: 100%;
    }

    .error {
      color: #ef4444;
      text-align: center;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 1rem;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 12px;
      backdrop-filter: blur(8px);
      animation: shake 0.5s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(40px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    #themeToggle {
      position: fixed;
      top: 2rem;
      right: 2rem;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      width: 56px;
      height: 56px;
      border-radius: 16px;
      font-size: 1.4rem;
      cursor: pointer;
      z-index: 999;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .light-theme #themeToggle {
      background: rgba(255, 255, 255, 0.8);
      border-color: rgba(0, 0, 0, 0.1);
    }

    #themeToggle:hover {
      transform: scale(1.1) rotate(15deg);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
    }

    /* Loading animation */
    .loading {
      position: relative;
      pointer-events: none;
    }

    .loading::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 20px;
      height: 20px;
      border: 2px solid transparent;
      border-top: 2px solid currentColor;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

    @media (max-width: 768px) {
      .login-container {
        padding: 2.5rem 2rem;
        margin: 1rem;
        border-radius: 20px;
      }

      h1 {
        font-size: 1.9rem;
      }

      .brand-icon {
        width: 56px;
        height: 56px;
        font-size: 1.3rem;
      }

      #themeToggle {
        width: 48px;
        height: 48px;
        top: 1.5rem;
        right: 1.5rem;
        font-size: 1.2rem;
      }
    }

    @media (max-width: 480px) {
      .main-content {
        padding: 1rem;
      }

      .login-container {
        padding: 2rem 1.5rem;
      }

      h1 {
        font-size: 1.7rem;
      }
    }
  </style>
</head>
<body class="dark-theme">
  <!-- Animated particles -->
  <div class="particles" id="particles"></div>

  <!-- Theme Toggle Button -->
  <button id="themeToggle" title="Toggle Theme">🌙</button>

  <div class="main-content">
    <div class="login-container">
      <div class="brand-section">
        <div class="brand-icon">🔍</div>
        <h1>Web Analyzer</h1>
        <div class="subtitle">Smart webpage analysis at your fingertips</div>
      </div>

      {% if error %}
        <div class="error">{{ error }}</div>
      {% endif %}

      <form method="post" id="loginForm">
        <div class="form-group">
          <div class="input-wrapper">
            <input type="text" name="username" placeholder="Username" required />
            <div class="input-icon">👤</div>
          </div>
        </div>
        <div class="form-group">
          <div class="input-wrapper">
            <input type="password" name="password" placeholder="Password" required />
            <div class="input-icon">🔒</div>
          </div>
        </div>
        <button type="submit" class="login-button" id="loginBtn">
          <span>Sign In</span>
        </button>
      </form>

      <div class="register-link">
        Don't have an account? <a href="{{ url_for('register') }}">Create one now</a>
      </div>
    </div>
  </div>

  <script>
    // Theme Toggle Functionality
    const toggleButton = document.getElementById('themeToggle');
    const body = document.body;

    if (!toggleButton || !body) {
      console.error('Theme toggle button or body element not found');
    } else {
      // Load saved theme or default to dark
      let savedTheme = 'dark';
      try {
        const storedTheme = localStorage.getItem('theme');
        if (storedTheme) {
          savedTheme = JSON.parse(storedTheme);
        }
      } catch (e) {
        console.warn('Error accessing localStorage:', e);
      }

      // Apply the saved theme
      body.className = `${savedTheme}-theme`;
      toggleButton.textContent = savedTheme === 'dark' ? '🌙' : '☀️';

      // Toggle theme on button click
      toggleButton.addEventListener('click', () => {
        console.log('Theme toggle clicked'); // Debugging
        const isDark = body.classList.contains('dark-theme');
        const newTheme = isDark ? 'light' : 'dark';

        // Update body class
        body.className = `${newTheme}-theme`;
        toggleButton.textContent = newTheme === 'dark' ? '🌙' : '☀️';

        // Store theme preference
        try {
          localStorage.setItem('theme', JSON.stringify(newTheme));
        } catch (e) {
          console.warn('Error saving theme to localStorage:', e);
        }
      });
    }

    // Particle System
    function createParticles() {
      const particlesContainer = document.getElementById('particles');
      if (!particlesContainer) return;
      const particleCount = Math.min(window.innerWidth / 20, 50);

      for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.top = Math.random() * 100 + '%';
        particle.style.animationDelay = Math.random() * 6 + 's';
        particle.style.animationDuration = (Math.random() * 3 + 3) + 's';
        particlesContainer.appendChild(particle);
      }
    }

    // Form Enhancement
    const loginForm = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');

    if (loginForm && loginBtn) {
      loginForm.addEventListener('submit', function (e) {
        loginBtn.classList.add('loading');
        loginBtn.querySelector('span').style.opacity = '0';
      });
    }

    // Enhanced input interactions
    document.querySelectorAll('input').forEach((input) => {
      input.addEventListener('focus', function () {
        this.parentElement.style.transform = 'translateY(-2px)';
      });

      input.addEventListener('blur', function () {
        this.parentElement.style.transform = 'translateY(0)';
      });
    });

    // Initialize particles on load
    document.addEventListener('DOMContentLoaded', createParticles);

    // Handle window resize for particles
    let resizeTimeout;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(() => {
        const particlesContainer = document.getElementById('particles');
        if (particlesContainer) {
          particlesContainer.innerHTML = '';
          createParticles();
        }
      }, 250);
    });
  </script>
</body>
</html>
